<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>moviefree - Stream Movies & TV Shows</title>
    <link rel="stylesheet" href="output.css" />
    <style>
      /* Premium styling for sleek custom scrollbars across layout engines */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #020617;
      }
      ::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #06b6d4;
      }
    </style>
  </head>
  <body
    class="bg-slate-950 text-slate-100 font-sans min-h-screen selection:bg-cyan-500/30 selection:text-cyan-200 antialiased flex flex-col justify-between"
  >
    <header
      class="sticky top-0 z-40 bg-slate-950/80 backdrop-blur-md border-b border-slate-900 shadow-xl shadow-slate-950/20"
    >
      <div
        class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 min-h-[5rem] flex flex-col lg:flex-row items-center justify-between gap-4 py-4 lg:py-0"
      >
        <div
          id="header-title"
          class="flex items-center gap-2 cursor-pointer group select-none flex-shrink-0"
        >
          <div
            class="bg-gradient-to-tr from-cyan-600 to-blue-500 p-2 rounded-xl shadow-lg shadow-cyan-500/20 group-hover:scale-105 transition-all duration-300"
          >
            <svg
              class="w-6 h-6 text-white"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"
              />
            </svg>
          </div>
          <span
            class="text-xl font-black bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent group-hover:from-cyan-400 group-hover:to-blue-400 transition-colors duration-300"
            >movie<span
              class="text-cyan-400 group-hover:text-white transition-colors"
              >free</span
            ></span
          >
        </div>

        <div
          class="relative w-full lg:max-w-4xl flex flex-col sm:flex-row gap-3 items-center flex-1 justify-end"
        >
          <select
            id="genre-filter"
            class="w-full sm:w-44 bg-slate-900 border border-slate-800 focus:border-cyan-500 text-sm rounded-xl py-3 px-3.5 text-white focus:outline-none transition-all duration-300 cursor-pointer shadow-inner shadow-black/40"
          ></select>

          <select
            id="status-filter"
            class="w-full sm:w-44 bg-slate-900 border border-slate-800 focus:border-cyan-500 text-sm rounded-xl py-3 px-3.5 text-white focus:outline-none transition-all duration-300 cursor-pointer shadow-inner shadow-black/40"
          >
            <option value="all">All Releases</option>
            <option value="released">Available Now</option>
            <option value="upcoming">Upcoming / Unreleased</option>
          </select>

          <form
            id="search-form"
            class="flex gap-2 w-full sm:max-w-xs md:max-w-sm flex-shrink-0"
          >
            <div class="relative w-full">
              <input
                id="search-input"
                type="text"
                autocomplete="off"
                placeholder="Search movies or TV shows..."
                class="w-full bg-slate-900 border border-slate-800 focus:border-cyan-500 text-sm rounded-xl py-3 pl-4 pr-10 text-white placeholder-slate-500 focus:outline-none transition-all duration-300 shadow-inner focus:shadow-cyan-500/5"
              />
              <div
                class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-slate-500"
              >
                <svg
                  class="w-4 h-4"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.5"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
                  />
                </svg>
              </div>
            </div>
            <button
              id="search-button"
              type="submit"
              class="bg-cyan-600 hover:bg-cyan-500 active:scale-95 text-white text-sm font-bold px-5 py-3 rounded-xl transition-all duration-200 shadow-lg shadow-cyan-600/10 flex-shrink-0"
            >
              Search
            </button>
          </form>

          <div
            id="suggestions-dropdown"
            class="absolute left-0 right-0 lg:left-auto lg:w-[384px] top-[100%] mt-2 bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl shadow-black overflow-hidden hidden z-50 divide-y divide-slate-800/60"
          >
            <div
              id="suggestions-list"
              class="max-h-[380px] overflow-y-auto"
            ></div>
          </div>
        </div>
      </div>
    </header>

    <main
      class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full flex flex-col gap-6"
    >
      <div
        class="flex items-center justify-between border-b border-slate-900 pb-4"
      >
        <h2
          id="status-message"
          class="text-sm font-black tracking-wider uppercase text-slate-400"
        >
          Loading Mirror Directories...
        </h2>
      </div>

      <div
        id="spinner-container"
        class="flex flex-col items-center justify-center py-20 gap-4 hidden"
      >
        <div
          class="w-12 h-12 border-4 border-slate-800 border-t-cyan-500 rounded-full animate-spin shadow-lg"
        ></div>
        <p
          class="text-xs font-bold text-slate-500 tracking-widest uppercase animate-pulse"
        >
          Synchronizing Data Blocks...
        </p>
      </div>

      <div
        id="movie-grid"
        class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 sm:gap-6"
      ></div>
    </main>

    <footer class="w-full border-t border-slate-900 bg-slate-950/40 mt-auto">
      <div
        class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex flex-col sm:flex-row items-center justify-between gap-2 py-4 sm:py-0 text-xs text-slate-500"
      >
        <p>&copy; 2026 moviefree. All rights reserved.</p>
        <p class="font-medium flex items-center gap-1">
          Made by
          <span
            class="text-slate-300 hover:text-cyan-400 transition-colors font-bold tracking-wide"
            >Emmanuel</span
          >
        </p>
      </div>
    </footer>

    <div
      id="video-modal"
      class="fixed inset-0 z-50 hidden overflow-y-auto bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-4 transition-all duration-300"
    >
      <div
        class="relative w-full max-w-6xl bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl shadow-cyan-500/5 overflow-hidden transform transition-all flex flex-col max-h-[90vh]"
      >
        <div
          class="flex items-center justify-between p-4 border-b border-slate-800 bg-slate-950/50"
        >
          <div class="flex items-center gap-3">
            <h2
              id="modal-movie-title"
              class="text-lg md:text-xl font-extrabold text-white truncate max-w-[200px] sm:max-w-md"
            >
              Loading Title...
            </h2>
            <span
              id="modal-movie-date"
              class="text-xs font-semibold px-2 py-0.5 rounded bg-slate-800 text-slate-400 border border-slate-700"
              >N/A</span
            >
            <span
              id="modal-movie-rating"
              class="text-xs font-bold text-amber-400 bg-amber-400/10 px-2 py-0.5 rounded border border-amber-400/20 flex items-center gap-1"
              >N/A</span
            >
          </div>

          <button
            id="close-modal"
            class="text-slate-400 hover:text-white bg-slate-800 hover:bg-slate-700 p-2 rounded-xl transition-all duration-200"
          >
            <svg
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M6 18L18 6M6 6l12 12"
              />
            </svg>
          </button>
        </div>

        <div class="flex flex-col lg:flex-row flex-1 overflow-y-auto">
          <div
            class="w-full lg:w-[65%] bg-black flex flex-col justify-between border-b lg:border-b-0 lg:border-r border-slate-800"
          >
            <div class="relative w-full aspect-video bg-slate-950 shadow-inner">
              <iframe
                id="video-player"
                src=""
                class="absolute inset-0 w-full h-full border-0"
                allowfullscreen
                allow="autoplay; encrypted-media"
              ></iframe>
            </div>

            <div class="flex items-center justify-between p-4 bg-slate-950/40">
              <div
                class="flex bg-slate-900 border border-slate-800 p-1 rounded-xl"
              >
                <button
                  id="toggle-movie"
                  class="text-xs font-bold px-4 py-2 rounded-lg transition-all text-white bg-cyan-500 shadow-md"
                >
                  Main Source
                </button>
                <button
                  id="toggle-trailer"
                  class="text-xs font-bold px-4 py-2 rounded-lg transition-all text-slate-400 hover:text-white bg-transparent"
                >
                  Trailer
                </button>
              </div>

              <a
                id="download-button"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
                class="text-xs font-extrabold px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white transition-all shadow-md shadow-emerald-600/20 flex items-center gap-1.5 cursor-pointer select-none"
                title="Left-click opens stream in a new tab. Right-click or middle-click switches mirror."
              >
                <svg
                  class="w-4 h-4 fill-none stroke-current"
                  stroke-width="2"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"
                  />
                </svg>
                Open Mirror
              </a>
            </div>
          </div>

          <div
            class="w-full lg:w-[35%] p-5 flex flex-col gap-5 bg-slate-900/40 overflow-y-auto"
          >
            <div
              id="tv-controls-container"
              class="hidden flex flex-col gap-3 p-4 bg-slate-950/60 border border-slate-800/80 rounded-xl"
            >
              <span
                class="text-[10px] font-black tracking-wider text-purple-400 uppercase"
                >TV Show Controller</span
              >
              <div class="grid grid-cols-2 gap-3">
                <div class="flex flex-col gap-1.5">
                  <label class="text-[11px] font-bold text-slate-400"
                    >Season</label
                  >
                  <select
                    id="season-select"
                    class="w-full text-xs font-bold bg-slate-900 border border-slate-700 text-white p-2.5 rounded-lg focus:outline-none focus:border-cyan-500 transition-colors"
                  ></select>
                </div>
                <div class="flex flex-col gap-1.5">
                  <label class="text-[11px] font-bold text-slate-400"
                    >Episode</label
                  >
                  <select
                    id="episode-select"
                    class="w-full text-xs font-bold bg-slate-900 border border-slate-700 text-white p-2.5 rounded-lg focus:outline-none focus:border-cyan-500 transition-colors"
                  ></select>
                </div>
              </div>
            </div>

            <div id="server-selection-wrapper" class="flex flex-col gap-2.5">
              <span
                class="text-[10px] font-black tracking-wider text-cyan-400 uppercase"
                >Available Node Gateways</span
              >
              <div
                id="server-toggles-container"
                class="grid grid-cols-1 sm:grid-cols-2 gap-2"
              ></div>
            </div>

            <hr class="border-slate-800/80" />

            <div class="flex gap-4 items-start">
              <img
                id="modal-movie-poster"
                src=""
                class="w-20 md:w-24 rounded-lg object-cover bg-slate-950 border border-slate-800 shadow-lg flex-shrink-0"
                alt="Poster"
              />
              <div class="flex flex-col gap-1.5">
                <span
                  class="text-[10px] font-black tracking-wider text-slate-400 uppercase"
                  >Story Synopsis</span
                >
                <p
                  id="modal-movie-overview"
                  class="text-xs text-slate-300 leading-relaxed max-h-[160px] overflow-y-auto pr-1"
                >
                  No summary description available.
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="index.js"></script>
  </body>
</html>
